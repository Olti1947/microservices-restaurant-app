<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
  <style>
    /* Same status colors as the mobile app. */
    :root { --received: #3d7dd8; --preparing: #f3a712; --ready: #2e8b57; --bg: #fff8f0; --text: #2d2a26; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 14px 20px; background: #e4572e; color: #fff; }
    header h1 { margin: 0; font-size: 22px; }
    #connection { font-size: 14px; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 12px; }
    main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; }
    h2 { margin: 0 0 12px; padding: 8px 12px; border-radius: 10px; font-size: 16px; color: #fff;
         display: flex; justify-content: space-between; align-items: center; }
    .order { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
             border-left: 6px solid; box-shadow: 0 2px 8px rgba(122, 74, 42, 0.12); }
    .order h3 { margin: 0 0 6px; display: flex; justify-content: space-between; font-size: 18px; }
    .order time { font-size: 13px; font-weight: normal; color: #8a817c; }
    .order ul { margin: 0 0 10px; padding-left: 18px; }
    .order button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-size: 15px;
                    font-weight: 600; cursor: pointer; color: #fff; }
    .order button:hover { filter: brightness(0.9); }
    .received { border-color: var(--received); } .received button, h2.received { background: var(--received); }
    .preparing { border-color: var(--preparing); } .preparing button, h2.preparing { background: var(--preparing); }
    .ready { border-color: var(--ready); } .ready button, h2.ready { background: var(--ready); }
    .new { animation: flash 1.5s; }
    @keyframes flash { from { background: #fff3b0; } to { background: #fff; } }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>👨‍🍳 Kitchen orders</h1>
    <span id="connection">Connecting…</span>
  </header>
  <main>
    <section><h2 class="received">🧾 Received <span id="received-count"></span></h2><div id="received"></div></section>
    <section><h2 class="preparing">🔥 Preparing <span id="preparing-count"></span></h2><div id="preparing"></div></section>
    <section><h2 class="ready">🔔 Ready <span id="ready-count"></span></h2><div id="ready"></div></section>
  </main>

  <script>
    // The Order service runs on port 8003 of the same machine that serves this page.
    const ORDER_URL = `http://${location.hostname}:8003`;

    // What the button on each column does: move the order to the next status.
    const NEXT = {
      received: { status: "preparing", label: "Start preparing" },
      preparing: { status: "ready", label: "Mark ready" },
      ready: { status: "served", label: "Mark served" },
    };

    // All orders on screen, by id.
    const orders = {};

    function render() {
      for (const status of Object.keys(NEXT)) {
        document.getElementById(status).innerHTML = "";
      }
      // Oldest first, so the kitchen works through orders in the order they came in.
      const sorted = Object.values(orders).sort((a, b) => a.created_at.localeCompare(b.created_at));
      for (const order of sorted) {
        const column = document.getElementById(order.status);
        if (column) column.appendChild(orderCard(order));
      }
      for (const status of Object.keys(NEXT)) {
        document.getElementById(`${status}-count`).textContent = sorted.filter((o) => o.status === status).length;
      }
    }

    function orderCard(order) {
      const card = document.createElement("div");
      card.className = `order ${order.status}` + (order.isNew ? " new" : "");
      order.isNew = false;

      const time = new Date(order.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      card.innerHTML = `<h3>Table ${order.table_number} <time>${time}</time></h3><ul></ul>`;
      for (const item of order.items) {
        const li = document.createElement("li");
        li.textContent = `${item.quantity} × ${item.name}`;
        card.querySelector("ul").appendChild(li);
      }

      const button = document.createElement("button");
      button.textContent = NEXT[order.status].label;
      button.onclick = () => setStatus(order.id, NEXT[order.status].status);
      card.appendChild(button);
      return card;
    }

    async function setStatus(id, status) {
      const response = await fetch(`${ORDER_URL}/orders/${id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      if (!response.ok) console.error(`Could not update order ${id}: ${response.status}`);
      // No need to update the screen here: the server sends "order-status" to the kitchen room.
    }

    async function loadOrders() {
      const response = await fetch(`${ORDER_URL}/orders`);
      for (const order of await response.json()) {
        if (order.status !== "served") orders[order.id] = order;
      }
      render();
    }

    // Live updates over Socket.IO.
    const socket = io(ORDER_URL);
    const connection = document.getElementById("connection");

    socket.on("connect", () => {
      connection.textContent = "● Live";
      socket.emit("join", { room: "kitchen" });
      loadOrders(); // also reloads after a reconnect, in case we missed something
    });
    socket.on("disconnect", () => (connection.textContent = "○ Disconnected"));

    socket.on("new-order", (order) => {
      orders[order.id] = { ...order, isNew: true };
      render();
    });

    socket.on("order-status", ({ id, status }) => {
      if (!orders[id]) return;
      if (status === "served") delete orders[id];
      else orders[id].status = status;
      render();
    });
  </script>
</body>
</html>
